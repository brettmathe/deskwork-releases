# Builds Deskwork and publishes the bundle + updater manifest as a GitHub
# Release on this repo. Because the workflow and the release live in the same
# repository, the automatic GITHUB_TOKEN is sufficient -- no PAT to rotate.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    # DMG bundling drives Finder over AppleScript and can hang rather than fail
    # when the runner has no usable GUI session. Cap it so a hang costs an hour,
    # not the six-hour default. See the note on `--bundles` below.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # Includes the guard that no hardcoded repository URL reaches the bundle.
      - name: Test
        working-directory: src-tauri
        run: cargo test

      - name: Typecheck
        run: npm run check

      - name: Derive version
        id: version
        run: echo "value=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ steps.version.outputs.value }}
          releaseName: Deskwork v${{ steps.version.outputs.value }}
          releaseBody: |
            Deskwork v${{ steps.version.outputs.value }} for macOS.

            Install the `.dmg`, or let an existing install update itself.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          # `app` produces the .app.tar.gz + .sig the updater consumes -- that is
          # the critical path. `dmg` is the first-install download; its
          # Finder/AppleScript step hangs on a shell with no GUI session but is
          # fine on this runner. If that ever changes, drop `,dmg` and installs
          # fall back to the .app.tar.gz.
          args: --target universal-apple-darwin --bundles app,dmg
